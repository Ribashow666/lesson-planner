name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  health-check:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          echo "ANTHROPIC_API_KEY=ci-placeholder" > .env
          echo "PORT=8080" >> .env

      - name: Build Docker images
        run: docker compose build

      - name: Start services (backend only for health check)
        run: |
          docker compose up -d backend
          sleep 15

      - name: Health check
        run: |
          docker compose exec -T backend wget -qO- http://localhost:3001/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
